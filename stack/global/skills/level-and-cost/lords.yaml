basis:
- quote: "check why the skills don't prevent such a waste, is there no proper skill for checking fr the correct ownership level and abstraction and going for makign sure to have functional and modular design, does that not icnlude the benchmarking and efficiency in the process itself? If not, try to reframe the skill more concise and focussed and make sure it also applies to introspection and that agents actually make sure to also question their own design and strive for efficiency through the whole stack"
