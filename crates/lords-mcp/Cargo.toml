[package]
name = "lords-mcp"
description = "Lords Command's MCP server (stdio): context, search and remember over the selected stores"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lords-mcp"
path = "src/main.rs"

[dependencies]
lords-core = { path = "../lords-core" }
# The official Rust MCP SDK (Apache-2.0): protocol framing and the stdio transport (v2 design §5: use a library).
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3"
