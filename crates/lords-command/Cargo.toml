[package]
name = "lords-command"
description = "Lords Command: a small native window over your agent stacks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lords-core = { path = "../lords-core" }
serde_json = "1"

# The window is a Windows app (it ships only as lords-command.exe); elsewhere the crate builds to a stub that says so,
# so the workspace builds, lints and tests on Linux too (D27).
[target.'cfg(windows)'.dependencies]
# The renderer is chosen here only (the code is renderer-agnostic); glow until measurement picks the one app's renderer.
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
