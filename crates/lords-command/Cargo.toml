[package]
name = "lords-command"
description = "Lords Command: a small native window over your agent stacks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The renderer is chosen here only (the code is renderer-agnostic); glow until measurement picks the one app's renderer.
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
lords-core = { path = "../lords-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
