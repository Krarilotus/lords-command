[package]
name = "lords-core"
description = "Stacks, entries, composition, check and privacy for Lords Command"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Unicode case folding for privacy terms; ICU4X like icu_normalizer, adds only its own data crate.
icu_casemap = { version = "2", default-features = false, features = ["compiled_data"] }
# Unicode normalisation (NFKD) for privacy terms; already in the tree through jsonschema's url → idna.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
jsonschema = { version = "0.33", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
