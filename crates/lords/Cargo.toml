[package]
name = "lords"
description = "Lords Command CLI: check, sync, import, retire, promote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lords-core = { path = "../lords-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# Test support only: a guard copy from before this build's child protocol, for the readiness tests across guard
# versions (tests/child.rs). Never packaged (tools/package.ps1 takes lords.exe and lords-command.exe).
[[bin]]
name = "lords-old-guard-stub"
path = "tests/support/old_guard.rs"
test = false
doc = false

# Test support only: `codex app-server` answering `hooks/list` as `lords paths` asks it (tests/role.rs). Never packaged.
[[bin]]
name = "lords-codex-stub"
path = "tests/support/codex_stub.rs"
test = false
doc = false
